<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A&amp;M beta</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Albert &amp; Milly">
<meta name="theme-color" content="#141210">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../icon-192.png">
<style id="css">@import url("https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap");

:root{--bg:#faf6f1;--card:#fff;--ink:#2b2622;--mute:#8a8079;--line:#ece4db;--albert:#e07a2e;--milly:#3b3b3b;--ok:#3e9a63;--warn:#d49a1f;--bad:#c9453b;--accent:var(--albert)}
body.milly{--accent:var(--milly)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1917;--card:#262321;--ink:#f1ebe5;--mute:#a39990;--line:#37322e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
#root{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 90px)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0}
.save{font-size:12px;color:var(--mute)}
.switch{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.switch button{border:0;background:transparent;padding:10px;border-radius:11px;font-weight:600;font-size:16px;color:var(--mute)}
.switch button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card h3{font-size:16px;margin:14px 0 6px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.big{font-size:30px;font-weight:700}
.mute{color:var(--mute);font-size:14px}
.small{font-size:13px}
button.b,label.b{border:0;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:600;background:var(--line);color:var(--ink);display:inline-block;margin:0;cursor:pointer}
button.s{padding:8px 11px;font-size:14px}
button.p,label.p{background:var(--accent);color:#fff}
button.x{background:transparent;color:var(--mute);padding:6px 8px;font-size:14px;border:0}
button.w{width:100%}
input,select,textarea{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;width:100%}
label.l{display:block;font-size:13px;color:var(--mute);margin:8px 0 4px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}
.bar>div{height:100%;background:var(--accent);border-radius:6px}
.bar.over>div{background:var(--bad)}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;color:#fff}
.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}.neutral{background:var(--mute)}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:16px}
.check:first-of-type{border-top:0}
.check .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff;font-weight:700}
.check.done .box{background:var(--accent);border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px}
.stat b{display:block;font-size:20px}
.list .it{padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-of-type{border-top:0}
.food{padding:10px 0;border-top:1px solid var(--line)}
.food:first-of-type{border-top:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;display:flex;overflow-x:auto;scrollbar-width:none;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav button{border:0;background:transparent;color:var(--mute);font-size:9.5px;padding:6px 0;font-weight:600;white-space:nowrap;overflow:hidden}
nav button span{display:block;font-size:19px;line-height:1.25}
nav button.on{color:var(--accent)}
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datebar b{font-size:17px}
svg text{fill:var(--mute);font-size:11px}
.note{font-size:13px;color:var(--mute);margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:88vh;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 12px;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--mute);text-align:center;font-weight:600}
.cal .d{background:var(--bg);border-radius:10px;min-height:58px;padding:4px;font-size:12px;border:2px solid transparent;display:flex;flex-direction:column;gap:2px}
.cal .d.today{border-color:var(--accent)}
.cal .d.fut{opacity:.35}
.cal .d .n{font-weight:700}
.cal .d .ic{font-size:10px;line-height:1.15;word-break:break-all}
.cal .cl{display:flex;align-items:flex-start;gap:2px}
.cal .d{min-height:64px}
.spot{display:inline-block;width:20px;height:20px;flex:none;vertical-align:-5px}
.cal .spot{width:16px;height:16px}
.cal .fd{height:4px;border-radius:2px;background:var(--line)}
.cal .fd.g{background:var(--ok)}.cal .fd.r{background:var(--bad)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumbs .t{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--line);display:grid;place-items:center;font-size:11px;text-align:center;color:var(--ink);text-decoration:none;padding:4px}
.thumbs img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.hbar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}
.hbar span:first-child{flex:0 0 46%}
.hbar .bar{flex:1;margin:0}
.amt{width:84px;text-align:right;padding:6px 8px;font-weight:600}
.rv{white-space:normal}.rv .ln{margin:5px 0;font-size:15px;line-height:1.45}.rv .lab{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-top:10px}
.rv .catn{display:flex;align-items:center;gap:6px;font-weight:700;margin:12px 0 2px}
.file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.viewer img{width:100%;border-radius:12px}

/* ---- visual refresh ---- */
:root{--bg:#f6f1ea;--card:#fffdf9;--line:#ebe2d6;--shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.06);--onaccent:#fff;--g-albert:linear-gradient(135deg,#f7a457 0%,#e2702c 60%,#c95a1d 100%);--g-milly:linear-gradient(135deg,#5b5b5b 0%,#2c2c2c 60%,#151515 100%)}
@media (prefers-color-scheme:dark){:root{--bg:#141210;--card:#1f1c19;--line:#2f2a25;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}body.milly{--milly:#ececec;--onaccent:#161412}}
html,body{font-family:Nunito,-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
body.albert{--grad:var(--g-albert)}body.milly{--grad:var(--g-milly)}
h1{font-size:22px;font-weight:900;letter-spacing:-.02em}
.card{border:0;border-radius:22px;box-shadow:var(--shadow);padding:16px}
.card h2{font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--mute);display:flex;align-items:center;gap:8px}
button.b,label.b,a.b{border-radius:999px;font-weight:800;font-family:inherit;text-decoration:none}
button.p,label.p{color:var(--onaccent);box-shadow:0 4px 14px -4px var(--accent)}
.chip.on{color:var(--onaccent)}.check.done .box{color:var(--onaccent)}
input,select,textarea{border-radius:14px;font-family:inherit}
.big{font-weight:900;letter-spacing:-.02em}
.stat{border-radius:16px}
nav{background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav button{border-radius:12px;margin:0 1px;transition:background .15s;letter-spacing:-.01em}
nav button.on{background:color-mix(in srgb,var(--accent) 14%,transparent)}
/* cat switcher */
.switch{background:transparent;padding:0;gap:10px}
.switch button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);text-align:left;border:2px solid transparent}
.switch button.on{border-color:var(--accent);box-shadow:0 6px 20px -8px var(--accent)}
.switch .spot{width:34px;height:34px}.switch .nm{display:block;font-weight:900;font-size:16px;color:var(--ink)}.switch .wt{display:block;font-size:12px;color:var(--mute);font-weight:700}
/* hero */
.hero{background:var(--grad);color:#fff;border-radius:26px;padding:18px;margin-bottom:12px;box-shadow:0 14px 30px -14px rgba(0,0,0,.45);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .top{display:flex;align-items:center;gap:12px}.hero .spot{width:52px;height:52px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
.hero .nm{font-size:22px;font-weight:900;line-height:1}.hero .sub{font-size:13px;opacity:.85;font-weight:700;margin-top:3px}
.hero .wt{font-size:42px;font-weight:900;letter-spacing:-.03em;margin-top:12px;line-height:1}.hero .wt small{font-size:16px;opacity:.8;font-weight:800}
.hero .track{height:10px;border-radius:6px;background:rgba(255,255,255,.25);margin:12px 0 6px;overflow:hidden}.hero .track>div{height:100%;background:#fff;border-radius:6px}
.hero .ends{display:flex;justify-content:space-between;font-size:12px;font-weight:800;opacity:.9}
.hero .pill{background:rgba(255,255,255,.22);color:#fff;margin-top:10px;backdrop-filter:blur(6px)}
/* read views */
.kv{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.kv:first-child{border-top:0}.kv .k{color:var(--mute);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding-top:3px}.kv .v{font-size:15px;line-height:1.45}
.pl{margin:2px 0 10px;font-size:15px;line-height:1.5}
.catcard{border-radius:20px;padding:14px;margin-top:12px;background:var(--bg);position:relative;overflow:hidden}
.catcard .head{display:flex;align-items:center;gap:12px;margin:-14px -14px 10px;padding:14px;background:var(--g);color:#fff}
.catcard .head .spot{width:44px;height:44px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}.catcard .head b{font-size:19px;font-weight:900;display:block}.catcard .head span{font-size:12px;opacity:.85;font-weight:700}
.ci{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.ci:first-of-type{border-top:0}.ci .ic{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:17px;flex:none}
.ci .t{font-size:11px;color:var(--mute);font-weight:800;text-transform:uppercase;letter-spacing:.06em}.ci .val{font-size:15px;font-weight:600}
a.ci .val{color:var(--accent)}a.ci:after{content:"›";margin-left:auto;color:var(--mute);font-size:22px}
.subhead{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:14px 0 4px}
.ticket{border-radius:20px;margin-top:12px;background:var(--bg);overflow:hidden}
.ticket .tt{display:flex;align-items:center;justify-content:space-between;padding:14px;background:linear-gradient(135deg,#f7a457,#5b5b5b);color:#fff}
.ticket .dates{font-size:20px;font-weight:900;letter-spacing:-.01em}.ticket .nights{font-size:12px;font-weight:800;opacity:.9}
.ticket .tb{padding:12px 14px}.ticket .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--card)}
.tag.ok{background:var(--ok);color:#fff}
.ghost{background:transparent!important;border:1.5px solid var(--line)!important;color:var(--ink)!important;box-shadow:none!important}

/* calendar */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);padding:5px;border-radius:18px;box-shadow:var(--shadow);margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:14px;padding:8px 4px;display:flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:800;color:var(--mute);font-size:14px}
.seg button.on{background:var(--grad,var(--g-albert));color:#fff;box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.seg .spot{width:22px;height:22px}.seg .faces .spot+.spot{margin-left:-8px}
.calcard{padding:14px 10px}
.calhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.calhead .mname{font-size:24px;font-weight:900;letter-spacing:-.02em;text-align:center;line-height:1}.calhead .yname{font-size:12px;font-weight:800;color:var(--mute);text-align:center}
.rnd{width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);font-size:22px;font-weight:900}
.cal{gap:5px}.cal .h{font-size:11px;font-weight:800;padding-bottom:4px}
.cal .d{min-height:54px;border-radius:14px;padding:5px 4px;background:var(--bg);border:2px solid transparent;align-items:center;position:relative;gap:3px;cursor:pointer}
.cal .d .n{font-size:14px;font-weight:800}
.cal .d.today .n{background:var(--grad,var(--g-albert));color:#fff;border-radius:999px;padding:0 7px}
.cal .d.sel{border-color:var(--accent)}
.cal .d.fut{opacity:.45}
.cal .d.hotel{background:repeating-linear-gradient(135deg,color-mix(in srgb,#7aa7ff 22%,var(--bg)) 0 6px,var(--bg) 6px 12px)}
.cal .dots{display:flex;gap:3px;min-height:9px}
.cd{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.cd.albert{background:#e8822f}.cd.milly{background:#2a2a2a;box-shadow:inset 0 0 0 1.5px #fff}
@media (prefers-color-scheme:dark){.cd.milly{background:#f2f2f2;box-shadow:inset 0 0 0 2.5px #2a2a2a}}
.cd.ok{outline:2px solid var(--ok);outline-offset:1px}.cd.over{outline:2px solid var(--bad);outline-offset:1px}
.cal .ics{font-size:9px;line-height:1}
.fb,.fbx{position:absolute;top:-4px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;font-style:normal;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.fbx{position:static;display:inline-grid}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:12px;padding:10px 6px 2px;border-top:1px solid var(--line);font-size:11px;font-weight:700;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .hb{display:inline-block;width:14px;height:12px;border-radius:4px;background:repeating-linear-gradient(135deg,color-mix(in srgb,#7aa7ff 40%,var(--bg)) 0 3px,var(--bg) 3px 6px)}
.dayttl{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.dnum{width:52px;height:52px;border-radius:16px;background:var(--grad,var(--g-albert));color:#fff;display:grid;place-items:center;font-size:24px;font-weight:900}
.dw{font-size:18px;font-weight:900}
.dcat{background:var(--bg);border-radius:18px;margin-top:12px;overflow:hidden}
.dcat .dch{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--g);color:#fff}
.dcat .dch .spot{width:32px;height:32px}.dcat .dch b{font-size:16px;font-weight:900}.dcat .dch .b{margin-left:auto;background:rgba(255,255,255,.22);color:#fff}
.dcat .ci{padding:10px 12px}.dcat .ci .ic{background:var(--card)}.dcat .pl{padding:0 12px}

/* to do + stock */
.todo{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.card>.todo:first-of-type{border-top:0;margin-top:6px}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:none;color:var(--onaccent);font-weight:900;font-size:14px;margin-top:1px}
.todo.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}.todo.done .tx{text-decoration:line-through;color:var(--mute)}
.tt2{flex:1}.tx{font-size:15px;font-weight:600;line-height:1.4}.due{font-size:12px;font-weight:800;color:var(--mute);margin-top:2px}.due.late{color:var(--bad)}
.addrow{display:grid;grid-template-columns:1fr 120px auto;gap:6px;margin-top:10px}
.stk{background:var(--bg);border-radius:16px;padding:12px;margin-top:10px}.stk .val{font-weight:800}.stk.low{box-shadow:inset 0 0 0 2px var(--bad)}

nav::-webkit-scrollbar{display:none}nav button{flex:0 0 auto;min-width:54px;padding:6px 4px}
.hero.money{background:linear-gradient(135deg,#3e9a63,#1f6b45)}

nav{display:block!important;overflow:visible!important;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)!important}
.navin{display:grid;grid-template-columns:repeat(10,1fr);max-width:560px;margin:0 auto;gap:1px}
nav .navin button{min-width:0!important;padding:6px 0!important;font-size:8.5px;margin:0;white-space:normal;line-height:1.1;overflow:hidden}
nav .navin button span{font-size:18px;line-height:1.3}
/* fights + hows theme */
body.duo{--accent:#7a5af8;--onaccent:#fff;--grad:linear-gradient(135deg,#9a7dff 0%,#6a4ae6 55%,#4a2fc0 100%)}
.hero.duo-h{background:linear-gradient(135deg,#9a7dff 0%,#6a4ae6 55%,#4a2fc0 100%)}
.hero .stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.hero .stats3 div{background:rgba(255,255,255,.16);border-radius:16px;padding:10px;text-align:center}.hero .stats3 b{display:block;font-size:26px;font-weight:900;line-height:1}.hero .stats3 span{font-size:11px;font-weight:800;opacity:.85}
.hero svg text{fill:rgba(255,255,255,.75)}
.vs{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 2px}.vs .spot{width:54px;height:54px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}.vs b{font-size:14px;font-weight:900;opacity:.85}
.ins{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.card .ins:first-of-type{border-top:0}
.ins .ic{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--accent) 14%,var(--bg));display:grid;place-items:center;font-size:19px;flex:none}
.ins b{display:block;font-size:15px;font-weight:900;margin-bottom:2px}.ins p{margin:0;font-size:14px;line-height:1.45;color:var(--ink)}
.split{display:flex;height:14px;border-radius:8px;overflow:hidden;margin:8px 0 4px;background:var(--line)}.split div{height:100%}
.fl{display:flex;gap:10px;align-items:flex-start}.fl .spot{width:30px;height:30px;flex:none;margin-top:2px}
.sevdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

.navin{display:flex!important;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:4px;max-width:600px;margin:0 auto;padding:0 10px;scrollbar-width:none;overscroll-behavior-x:contain}
.navin::-webkit-scrollbar{display:none}

<div id="root"></div>
<script id="app">
(function(){
var LS='am-tracker';
var GH=null;try{GH=JSON.parse(localStorage.getItem(LS+'-gh')||'null')}catch(e){}
var S=null,BASE=null,SHA=null,dirty=false;
try{var cache=JSON.parse(localStorage.getItem(LS+'-cache')||'null');if(cache&&cache.S){S=cache.S;BASE=cache.BASE;SHA=cache.SHA;dirty=!!cache.dirty}}catch(e){}
var ui={cat:'albert',tab:'today',day:today(),month:today().slice(0,7),modal:null,f:null,pend:[]};
var pending=false;
try{var u=JSON.parse(localStorage.getItem(LS+'-uib')||'{}');if(u.cat)ui.cat=u.cat;if(u.tab)ui.tab=u.tab;if(u.calWho)ui.calWho=u.calWho;}catch(e){}
var saveState=S?(dirty?'Saving…':'Synced'):'Loading…',timer=null;
if(S)migrate();

var TRIG=['Milly begging for food','Mealtime / food around','Milly close to him (bed, sofa)','He was stalking or sniffing her','Morning in bed','Night','I just got home','No play yet today','Door or room swap','Noise or visitor','No obvious reason'];
var SEV=['Stare / stalk','Chase / hiss','Bite','Full fight'];
var WHERE=['Bedroom','Kitchen','Hall','Living room','Bathroom','Other'];
var WHO=['Albert','Milly','Not sure'];
var PC=['Hard pellets','Firm, well formed','Soft but formed','Mushy, no shape','Liquid'];
var AMT=['Small','Normal','Large'];var SMELL=['Normal','Strong','Really bad'];
var LX=['Blood','Mucus','Outside the tray','Straining','Worms / bits','Hair / fur'];
var HT=['Cough / wheeze episode','Fast breathing at rest','Vomit','Loose stool / diarrhoea','Off food / skipped meal','Other'];

function migrate(){if(!S.fights)S.fights=[];if(!S.calm)S.calm=[];
  if(!S.costs)S.costs=[{id:'c1',d:'2026-11-07',who:'albert',cat:'Vet',amount:104.5,reimb:75,desc:'Mercator: vaccinations',n:'OHRA ref 97022680'},{id:'c2',d:'2026-11-07',who:'albert',cat:'Food',amount:37.5,reimb:0,desc:'Diet food bought at the vet',n:'Not covered by OHRA'},{id:'c3',d:'2026-11-07',who:'milly',cat:'Vet',amount:65.75,reimb:52.6,desc:'Mercator: vaccinations',n:'OHRA ref 97022677'},{id:'c4',d:'2026-12-19',who:'both',cat:'Hotel / sitter',amount:280,reimb:0,desc:"Betty's Kattenhotel, 10 nights",n:'Pay at drop-off',planned:true}];['albert','milly'].forEach(function(k){if(!S.cats[k].treat)S.cats[k].treat=[]});
  if(!S.todos)S.todos=[{id:'t1',text:'Change Bertie to Albert on everything (vet, OHRA, microchip registration, Betty\'s)',done:false,due:''},{id:'t2',text:'Email Betty\'s: check Milly is in the quiet department',done:false,due:'2026-12-18'},{id:'t3',text:'Add both OHRA policy numbers in Info',done:false,due:''},{id:'t4',text:'Cancel the open Cat in a Flat sitter requests',done:false,due:''}];
  if(!S.stock)S.stock={};if(!S.extraStock)S.extraStock=[{id:'x1',name:'Probiotic',qty:'',unit:'doses',check:'Probiotic',cat:'albert'},{id:'x2',name:'Digestive powder',qty:'',unit:'doses',check:'Digestive powder',cat:'albert'},{id:'x3',name:'Cat\'s Best litter',qty:'',unit:'bags'}];if(S.info&&S.info.insurance&&S.info.insurance.yearAlbert==null){var In=S.info.insurance;In.policyAlbert=In.policyAlbert||In.policy||'';In.policyMilly=In.policyMilly||'';In.yearAlbert='1 Jul to 30 Jun';In.yearMilly='1 Feb to 31 Jan';In.notes=(In.notes||'').replace(/^Separate insurance years:[^\n]*\n?/,'Two separate OHRA policies, one per cat.\n')}if(!S.profiles)S.profiles={albert:'',milly:'',ages:''};if(!S.notes)S.notes={bullying:''};if(!S.litter)S.litter=[];
  if(!S.info)S.info={insurance:{provider:'',policy:'',phone:'',email:'',notes:'Both cats on the same policy.',att:[]},vet:{clinic:'',address:'',phone:'',email:'',hours:'',notes:'',att:[]},hotel:{name:"Betty's cat hotel",address:'',phone:'',email:'',notes:'Milly: quiet / older / shyer department. Albert: playful department.',att:[]},bookings:[]};if(!S.playTypes)S.playTypes=['Wand','Throwing & catching','Fetch','Basket play','Lead walk'];
  ['albert','milly'].forEach(function(k){var c=S.cats[k];if(!c.vet)c.vet=[];if(c.treatKcal==null)c.treatKcal=2;
    if(!c.foods){c.foods=[{id:'dry1',name:c.dryFood||'Dry',kind:'dry',kcal:370},{id:'wet1',name:c.wetFood||'Wet',kind:'wet',kcal:80}];
      Object.keys(c.days).forEach(function(d){var x=c.days[d];x.f={dry1:x.dry||0,wet1:x.wet||0};if(typeof x.play==='number')x.play=x.play?{Other:x.play}:{};});}
    Object.keys(c.days).forEach(function(d){var x=c.days[d];if(!x.f)x.f={};if(!x.play||typeof x.play==='number')x.play={};if(!x.photos)x.photos=[];if(!x.checks)x.checks={};});
    c.health.forEach(function(h){if(!h.att)h.att=[]});c.vet.forEach(function(v){if(!v.att)v.att=[]});});
  S.fights.forEach(function(f){if(!f.att)f.att=[]})}

function today(){return iso(new Date())}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){var p=s.split('-');return new Date(+p[0],p[1]-1,+(p[2]||1))}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function nice(s){var t=today();if(s===t)return'Today';if(s===addDays(t,-1))return'Yesterday';return parse(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function short(s){return s?parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'No date'}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){return Math.round(n*10)/10}
function cat(){return S.cats[ui.cat]}
function day(c,d){c=c||cat();d=d||ui.day;if(!c.days[d])c.days[d]={f:{},treats:0,play:{},checks:{},note:'',photos:[]};return c.days[d]}
function peek(c,d){return c.days[d]}
function sorted(c){return c.weights.slice().sort(function(a,b){return a.d<b.d?-1:1})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function firstOf(c,k){for(var i=0;i<c.foods.length;i++)if(c.foods[i].kind===k)return c.foods[i];return null}
function dayTotals(c,d){var t={dry:0,wet:0,kcal:0,play:0};if(!d)return t;
  c.foods.forEach(function(f){var a=d.f[f.id]||0;if(f.kind==='dry'){t.dry+=a;t.kcal+=a*f.kcal/100}else{t.wet+=a;t.kcal+=a*f.kcal}});
  t.kcal+=(d.treats||0)*(c.treatKcal||0);for(var k in d.play)t.play+=d.play[k]||0;return t}

/* saving */
function change(){S.savedAt=Date.now();dirty=true;persist();saveState='Saving…';render();clearTimeout(timer);timer=setTimeout(push,1200)}
function persist(){try{localStorage.setItem(LS+'-cache',JSON.stringify({S:S,BASE:BASE,SHA:SHA,dirty:dirty}))}catch(e){}}
function b64e(str){return btoa(unescape(encodeURIComponent(str)))}
function b64d(b){return decodeURIComponent(escape(atob(String(b).replace(/\s/g,''))))}
function api(path,opt){opt=opt||{};var h={'Authorization':'Bearer '+GH.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};var oh=opt.headers||{};for(var k in oh)h[k]=oh[k];
  return fetch('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/contents/'+path+(opt.q||''),{method:opt.method||'GET',headers:h,body:opt.body,cache:'no-store'})}
function pull(){return api('data.json').then(function(r){if(r.status===401||r.status===403)throw{auth:1};if(r.status===404)throw{noaccess:1};if(!r.ok)throw{http:r.status};return r.json()}).then(function(j){if(!j)return null;return{data:JSON.parse(b64d(j.content)),sha:j.sha}})}
function eq(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function keyOf(x){return x&&typeof x==='object'?(x.id!=null?'i:'+x.id:x.d!=null?'d:'+x.d:'j:'+JSON.stringify(x)):'p:'+JSON.stringify(x)}
function merge3(b,l,r){if(eq(l,r))return l;if(l===undefined)return r;if(r===undefined)return l;if(eq(l,b))return r;if(eq(r,b))return l;
  if(Array.isArray(l)&&Array.isArray(r)){var bm={},lm={},rm={},order=[];(Array.isArray(b)?b:[]).forEach(function(x){bm[keyOf(x)]=x});
    l.forEach(function(x){var k=keyOf(x);lm[k]=x;order.push(k)});r.forEach(function(x){var k=keyOf(x);rm[k]=x;if(!(k in lm))order.push(k)});
    var out=[];order.forEach(function(k){var B=bm[k],L=lm[k],R=rm[k];if(L!==undefined&&R!==undefined)out.push(merge3(B,L,R));else if(L!==undefined){if(B!==undefined&&eq(B,L))return;out.push(L)}else{if(B!==undefined&&eq(B,R))return;out.push(R)}});return out}
  if(l&&r&&typeof l==='object'&&typeof r==='object'){var o={},ks={};Object.keys(l).concat(Object.keys(r)).forEach(function(k){ks[k]=1});
    Object.keys(ks).forEach(function(k){var B=b&&typeof b==='object'?b[k]:undefined;if(!(k in l)){if(B!==undefined&&eq(B,r[k]))return;o[k]=r[k];return}if(!(k in r)){if(B!==undefined&&eq(B,l[k]))return;o[k]=l[k];return}o[k]=merge3(B,l[k],r[k])});return o}
  return l}
var pushing=false,tries=0,needRender=false;
function busy(){var ae=document.activeElement;return!!ui.modal||!!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))}
function setStatus(t){saveState=t;var el=document.querySelector('.save');if(el)el.textContent=t}
function push(){if(!GH||!S||pushing||!dirty)return;pushing=true;var snap=JSON.parse(JSON.stringify(S));
  api('data.json',{method:'PUT',body:JSON.stringify({message:'Update from '+(GH.who||'phone'),content:b64e(JSON.stringify(snap,null,1)),sha:SHA||undefined})})
  .then(function(r){if(r.status===409||r.status===422)return'conflict';if(r.status===401||r.status===403)throw{auth:1};if(!r.ok)throw{http:r.status};return r.json()})
  .then(function(res){if(res==='conflict'){if(++tries>4)throw{http:409};return pull().then(function(p){if(p){S=merge3(BASE,S,p.data);migrate();BASE=p.data;SHA=p.sha}pushing=false;dirty=true;persist();push()})}
    tries=0;SHA=res.content.sha;BASE=snap;dirty=!eq(S,snap);pushing=false;persist();setStatus(dirty?'Saving…':'Synced');if(dirty)setTimeout(push,300)})
  .catch(function(e){pushing=false;setStatus(e&&e.auth?'Access key not working':navigator.onLine===false?'Offline, will sync':'Not synced yet, retrying');setTimeout(push,15000)})}
function sync(){if(!GH||pushing)return Promise.resolve();return pull().then(function(p){
    if(!p){if(S){dirty=true;push()}return}
    if(p.sha===SHA&&S)return;
    var first=!S,merged=S?merge3(BASE,S,p.data):p.data,changed=!eq(merged,S);S=merged;migrate();BASE=p.data;SHA=p.sha;dirty=!eq(S,BASE);persist();
    if(dirty)push();if(first||changed){if(busy())needRender=true;else render()}setStatus(dirty?'Saving…':'Synced')})
  .catch(function(e){setStatus(e&&(e.auth||e.noaccess)?'Access key not working':S?'Offline, showing saved copy':'Could not load. Check connection');if(!S){if(e&&(e.auth||e.noaccess)){ui.gherr=keyErr(e);GH=null;try{localStorage.removeItem(LS+'-gh')}catch(x){}}render()}})}
/* photos and files: saved to photos/ in the data repo, cached on the phone */
var PH={};
function blobToB64(b){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(',')[1])};fr.onerror=rej;fr.readAsDataURL(b)})}
function ghUpload(blob,name){var ty=blob.type||'image/jpeg',ext=/pdf/.test(ty)?'pdf':/png/.test(ty)?'png':/video/.test(ty)?(/quicktime/.test(ty)?'mov':'mp4'):'jpg',id=uid(),path='photos/'+today()+'-'+id+'.'+ext;
  return blobToB64(blob).then(function(b64){return api(path,{method:'PUT',body:JSON.stringify({message:'Add '+path,content:b64})})}).then(function(r){if(!r.ok)throw{http:r.status};
    try{PH[path]=URL.createObjectURL(blob);if(window.caches)caches.open('am-photos').then(function(c){c.put('https://photos.local/'+path,new Response(blob,{headers:{'Content-Type':ty}}))})}catch(e){}
    return{id:id,path:path,name:name,type:ty}})}
function photoURL(path){if(PH[path])return Promise.resolve(PH[path]);var key='https://photos.local/'+path;
  var fromCache=window.caches?caches.open('am-photos').then(function(c){return c.match(key)}):Promise.resolve(null);
  return fromCache.then(function(hit){if(hit)return hit.blob();return api(path,{headers:{Accept:'application/vnd.github.raw'}}).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(bl){if(window.caches)caches.open('am-photos').then(function(c){c.put(key,new Response(bl))});return bl})})
    .then(function(bl){PH[path]=URL.createObjectURL(bl);return PH[path]})}
function hydrate(){if(!GH)return;document.querySelectorAll('[data-ph]').forEach(function(el){var p=el.getAttribute('data-ph');if(!/^photos\//.test(p))return;photoURL(p).then(function(u){el.src=u}).catch(function(){})});
  document.querySelectorAll('[data-phl]').forEach(function(el){var p=el.getAttribute('data-phl');if(!/^photos\//.test(p))return;photoURL(p).then(function(u){el.href=u}).catch(function(){})})}
function keyErr(e){return e&&e.noaccess?'This key can\'t see your data. Make a new key and under Repository access choose Only select repositories → albert-milly-data, then Permissions → Contents: Read and write.':e&&e.auth?'That key didn\'t work (wrong or expired). Make a new one and paste it here.':'Could not reach GitHub. Check your internet connection.'}
var APPV='beta 1';var BETA=1;
function setupView(){var g=GH||{};return'<div class="hero duo-h" style="margin-top:20px"><div class="vs">'+spot('albert')+'<b>&amp;</b>'+spot('milly')+'</div><div style="text-align:center;font-size:24px;font-weight:900">Albert &amp; Milly</div><div class="sub" style="text-align:center;margin-top:4px">Connect this phone to your data</div></div>'+
  '<div class="card"><h2>One-time setup</h2><div class="pl">1. Tap <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="color:#b9a6ff"><b>Create access key</b></a> and sign in to GitHub.</div>'+
  '<div class="pl">2. Name it after this phone (e.g. <i>Martina iPhone</i>). Expiration: the longest option.</div><div class="pl">3. Repository access: <b>Only select repositories</b> → <b>albert-milly-data</b>.</div>'+
  '<div class="pl">4. Permissions → Repository permissions → <b>Contents: Read and write</b>.</div><div class="pl">5. Tap <b>Generate token</b>, copy it and paste it below.</div>'+
  '<label class="l">Access key</label><input id="ghtok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…"><label class="l">Whose phone is this?</label><div class="chips"><button class="chip'+(ui.who==='Martina'?' on':'')+'" data-a="ghwho" data-v="Martina">Martina</button><button class="chip'+(ui.who==='Eóin'?' on':'')+'" data-a="ghwho" data-v="Eóin">Eóin</button></div>'+
  '<details style="margin-top:10px"><summary class="mute small">Advanced</summary><label class="l">Data repository</label><input id="ghrepo" value="'+esc((g.owner||'martinaregan')+'/'+(g.repo||'albert-milly-data'))+'"></details>'+
  '<button class="b p w" style="margin-top:14px;padding:14px" data-a="ghconnect">Connect</button><div class="note" id="gherr" style="color:var(--bad);font-weight:700">'+esc(ui.gherr||'')+'</div><div class="note">Version '+APPV+'</div></div>'}
/* weight maths */
function stats(c){var w=sorted(c);if(!w.length)return null;
  var first=w[0],last=w[w.length-1],r={first:first,last:last,lost:first.kg-last.kg,pct:(first.kg-last.kg)/first.kg*100,toGo:last.kg-c.target};
  var ref=null;for(var i=w.length-2;i>=0;i--){if(daysBetween(w[i].d,last.d)>=5){ref=w[i];break}}
  if(ref){var days=daysBetween(ref.d,last.d);r.rate=(ref.kg-last.kg)/ref.kg*100/days*7;r.kgWeek=(ref.kg-last.kg)/days*7}
  if(r.kgWeek>0&&r.toGo>0){r.eta=addDays(last.d,Math.round(r.toGo/r.kgWeek*7))}
  return r}
function status(r,c){if(!r)return['neutral','No weigh-ins yet'];
  if(r.last.kg<=c.target)return['ok','Target reached'];
  if(r.rate==null)return['neutral','Need 2 weigh-ins 5+ days apart'];
  if(r.rate>1.5)return['bad','Too fast ('+r.rate.toFixed(1)+'%/wk), check with vet'];
  if(r.rate>=0.5)return['ok','On track ('+r.rate.toFixed(1)+'%/wk)'];
  if(r.rate>0)return['warn','Slow ('+r.rate.toFixed(1)+'%/wk)'];
  return['bad','Gaining or stalled']}

/* feeding suggestion */
function feed(c){var r=stats(c),dry=firstOf(c,'dry'),wet=firstOf(c,'wet');
  var rer=70*Math.pow(c.target,0.75),lo=0.8*rer,hi=rer;
  var wetK=wet?c.wetAllowance*wet.kcal:0,dryK=dry?c.dryAllowance*dry.kcal/100:0;
  var o={lo:lo,hi:hi,wetK:wetK,plan:wetK+dryK,dry:dry,wet:wet};
  if(dry){o.dLo=Math.max(0,(lo-wetK)/(dry.kcal/100));o.dHi=Math.max(0,(hi-wetK)/(dry.kcal/100))}
  var st=r&&r.rate!=null&&r.last.kg>c.target?r.rate:null,cur=c.dryAllowance;
  if(st==null)o.step='Keep the current amounts until there are 2 weigh-ins at least 5 days apart. The scale tells you more than any formula.';
  else if(st>1.5){o.next=Math.ceil(cur*1.1/5)*5;o.step='Losing too fast. Go up to about '+o.next+' g dry a day and ring the vet.'}
  else if(st>=0.5)o.step='Rate is good. Keep feeding exactly this.';
  else{o.next=Math.max(Math.floor(cur*0.9/5)*5,o.dLo?Math.ceil(o.dLo/5)*5:0);
    o.step=o.plan<=lo?'Loss is slow but the plan is already at the low end. Check for extra food before cutting, and ask the vet.':'Loss is slow. If it stays like this for 2 weeks, drop dry to about '+o.next+' g a day (roughly 10% less), after checking for extras.'}
  return o}

function litterSummary(c){var since=addDays(today(),-30),L=S.litter.filter(function(x){return x.who===c.name&&x.d>=since});if(!L.length)return null;
  var days=Object.keys(L.reduce(function(o,x){o[x.d]=1;return o},{})).length,po=L.filter(function(x){return x.type==='Poo'}),pe=L.filter(function(x){return x.type==='Pee'}),cs={},fl={},sm={};
  po.forEach(function(x){if(x.cons)cs[x.cons]=(cs[x.cons]||0)+1});
  L.forEach(function(x){if(x.smell)sm[x.smell]=(sm[x.smell]||0)+1;(x.extra||[]).forEach(function(e){fl[e]=(fl[e]||0)+1})});
  return{days:days,poo:po.length,pee:pe.length,cs:cs,fl:fl,sm:sm}}

/* food stock: remaining = what you had when you last set it, minus everything logged since */
function usedSince(c,f,since){var u=0;Object.keys(c.days).forEach(function(d){if(d>=since)u+=((c.days[d].f||{})[f.id]||0)+((c.days[d].waste||{})[f.id]||0)});return u}
function stockOf(k,f){var c=S.cats[k],st=S.stock[f.id];if(!st||st.qty==='')return null;var rem=st.qty-(usedSince(c,f,st.on)-(st.usedAtSet||0));
  var daily=0,n=0;for(var i=1;i<=7;i++){var x=peek(c,addDays(today(),-i));if(x&&x.f&&x.f[f.id]){daily+=x.f[f.id];n++}}
  daily=n?daily/n:(f.kind==='dry'?c.dryAllowance:c.wetAllowance)||0;
  return{rem:Math.max(0,rem),daily:daily,days:daily?Math.floor(Math.max(0,rem)/daily):null}}
function extraRem(x){if(x.qty===''||x.qty==null)return null;if(!x.check)return+x.qty;var u=0;(x.cat==='both'?['albert','milly']:[x.cat||'albert']).forEach(function(ck){var c=S.cats[ck];Object.keys(c.days).forEach(function(d){if(d>=x.on&&c.days[d].checks&&c.days[d].checks[x.check])u++})});return Math.max(0,x.qty-(u-(x.usedAtSet||0)))}
function vTodo(){var open=S.todos.filter(function(t){return!t.done}).sort(function(a,b){return(a.due||'9')<(b.due||'9')?-1:1}),done=S.todos.filter(function(t){return t.done}),t0=today();
  function row(t){var late=t.due&&!t.done&&t.due<t0;return'<div class="todo'+(t.done?' done':'')+'"><button class="tick" data-a="tdone" data-v="'+t.id+'">'+(t.done?'✓':'')+'</button><div class="tt2"><div class="tx">'+esc(t.text)+'</div>'+(t.due?'<div class="due'+(late?' late':'')+'">'+(late?'Overdue · ':'Due ')+short(t.due)+'</div>':'')+'</div><button class="x" data-a="tdel" data-v="'+t.id+'">✕</button></div>'}
  return'<div class="card"><div class="row between"><h2 style="margin:0">✅ To do</h2><span class="tag">'+open.length+' left</span></div>'+
    (open.length?open.map(row).join(''):'<div class="pl mute" style="margin-top:10px">All done 🎉</div>')+

    (done.length?'<details style="margin-top:8px"><summary class="mute small">Done ('+done.length+')</summary>'+done.map(row).join('')+'</details>':'')+'</div>'}

  function pill(days){if(days==null)return'<span class="dpill">–</span>';var c=days<7?'bad':days<14?'warn':'ok';return'<span class="dpill '+c+'">'+days+'d</span>'}
  function row(k,f,showCat){var o=info(k,f),pct=o.days!=null?Math.min(100,o.days/30*100):0;

    h+='<div class="card"><div class="row" style="gap:10px;flex-wrap:nowrap;margin-bottom:4px">'+spot(k).replace('class="spot"','class="spot" style="width:30px;height:30px"')+'<h2 style="margin:0">'+esc(c.name)+'\'s food</h2></div>'+mains.map(function(f){return row(k,f)}).join('');

    h+='<button class="b s ghost" style="margin-top:10px" data-a="addfood2" data-k="'+k+'">+ New food</button></div>'});
  var G=[['supp','💊 Supplements'],['treat','🍬 Treats'],['home','🏠 Household']];
  G.forEach(function(g){var xs=S.extraStock.map(function(x,i){return[x,i]}).filter(function(p){return(p[0].group||'home')===g[0]});if(!xs.length)return;
    h+='<details class="card" data-open="sg'+g[0]+'"'+(ed?' open':isOpen('sg'+g[0],false))+'><summary><b>'+g[1]+'</b> <span class="mute small">('+xs.length+')</span></summary>'+xs.map(function(p){var x=p[0],i=p[1],r=extraRem(x),lw=r!=null&&r<=(x.unit==='sticks'||x.unit==='scoops'||x.unit==='doses'?5:0);
      return'<div class="srow"><div style="flex:1;min-width:0"><div class="ell" style="font-weight:700">'+esc(x.name)+'</div><div class="small mute">'+(r==null?'Not set':r+' '+esc(x.unit||'')+' left')+(x.check?' · counts down when ticked':'')+'</div></div>'+
      (ed?'<input class="amt" inputmode="decimal" data-xstock="'+i+'" placeholder="how many" value="'+(r==null?'':r)+'">':(lw?'<span class="dpill bad">'+(r===0?'Out':'Low')+'</span>':''))+'</div>'}).join('')+'</details>'});
  return h}

function setStock(k,fid,qty){var c=S.cats[k],f=c.foods.filter(function(x){return x.id===fid})[0],t=today();S.stock[fid]={qty:qty,on:t,usedAtSet:((peek(c,t)||{}).f||{})[fid]||0}}

function lastTreat(c,type){return c.treat.filter(function(x){return x.type===type}).sort(function(a,b){return a.d<b.d?1:-1})[0]}
function treatDue(c,type){var l=lastTreat(c,type);if(!l||!l.next)return null;return{next:l.next,days:daysBetween(today(),l.next)}}

  else if(a==='ghwho'){ui.who=v;var tk=document.getElementById('ghtok').value;render();document.getElementById('ghtok').value=tk}
  else if(a==='ghconnect'){var tok=document.getElementById('ghtok').value.trim(),rp=(document.getElementById('ghrepo')?document.getElementById('ghrepo').value:'martinaregan/albert-milly-data').trim().split('/');
    if(!tok){ui.gherr='Paste your access key first.';render();return}var cand={token:tok,owner:rp[0],repo:rp[1],who:ui.who||'Martina'};var keep=GH;GH=cand;document.getElementById('gherr').textContent='Connecting…';
    pull().then(function(p){try{localStorage.setItem(LS+'-gh',JSON.stringify(GH))}catch(e){}ui.gherr='';S=null;BASE=null;SHA=null;dirty=false;if(p){S=p.data;migrate();BASE=p.data;SHA=p.sha;dirty=!eq(S,BASE);persist()}setStatus('Synced');render();if(dirty)push()})
    .catch(function(e){GH=keep;ui.gherr=keyErr(e);render()})}
  else if(a==='syncnow'){setStatus('Syncing…');sync().then(function(){if(dirty)push()})}
  else if(a==='ghout'){ui.modal=function(){return confirmBox('Disconnect this phone? Your data stays safe in GitHub; you\'ll need the access key to reconnect.','ghout2','x')};render()}
  else if(a==='ghout2'){try{localStorage.removeItem(LS+'-gh');localStorage.removeItem(LS+'-cache')}catch(e){}GH=null;S=null;ui.modal=null;render()}
  else if(a==='logsheet'){ui.modal=logSheet;render()}
  else if(a==='lcat'){ui.cat=v;render()}
  else if(a==='pseg'){ui.pseg=v;render()}
  else if(a==='jump'){jumpTo(v)}
  else if(a==='qlog'){ui.modal=null;var goT=function(sec){ui.tab='today';ui.day=today();render();setTimeout(function(){jumpTo(sec)},60)};
    if(v==='meal')goT('Log a meal');else if(v==='play')goT('Play');else if(v==='ticks')goT('Daily checklist');else if(v==='photo')goT('Photos');else if(v==='note')goT('Note for the day');
    else if(v==='treat'){goT('Log a meal');fire('treat','1')}
    else if(v==='weigh'){ui.tab='weight';render();scrollTo(0,0)}
    else if(v==='fight'){render();fire('fnew')}
    else if(v==='poo'||v==='pee'){ui.day=today();render();fire('lnew',v==='poo'?'Poo':'Pee')}
    else if(v==='worm'||v==='flea'){render();fire('trnew',v==='worm'?'Worming':'Flea')}}
  else if(a==='close'){ui.modal=null;ui.f=null;render()}
});
function confirmBox(msg,act,v){return'<div class="modal" data-a="close"><div class="sheet" data-stop="1"><p>'+esc(msg)+'</p><div class="row"><button class="b" style="background:var(--bad);color:#fff" data-a="'+act+'" data-v="'+v+'">'+(act==='ghout2'?'Disconnect':'Delete')+'</button><button class="b" data-a="close">Cancel</button></div></div></div>'}
function num(id){var x=parseFloat(String(document.getElementById(id).value).replace(',','.'));return isNaN(x)?null:x}
function flash(id){var el=document.getElementById(id)||document.querySelector('[data-w="'+id+'"]');if(!el)return;el.style.borderColor='var(--bad)';el.focus()}

var TABS=['today','calendar','progress','more'],sw=null;
document.addEventListener('touchstart',function(e){var t=e.target;if(ui.modal||t.closest('nav,input,textarea,select,.cal,svg,.modal')){sw=null;return}var p=e.touches[0];sw={x:p.clientX,y:p.clientY,t:Date.now()}},{passive:true});
document.addEventListener('touchend',function(e){if(!sw)return;var p=e.changedTouches[0],dx=p.clientX-sw.x,dy=p.clientY-sw.y;var quick=Date.now()-sw.t<600;sw=null;
  if(!quick||Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*0.6)return;var i=TABS.indexOf(ui.tab);if(i<0)return;var ni=i+(dx<0?1:-1);if(ni<0||ni>=TABS.length)return;ui.tab=TABS[ni];render();scrollTo(0,0)},{passive:true});
render();
setTimeout(function(){if(GH&&!S){ui.gherr='Still cannot load your data. Check your internet, or re-enter the access key (Only select repositories → albert-milly-data, Contents: Read and write).';GH=null;render()}},12000);
if(GH){sync();setInterval(function(){if(document.visibilityState==='visible')sync().then(function(){if(needRender&&!busy())render()})},20000)}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&GH)sync()});
window.addEventListener('online',function(){if(GH){sync();push()}});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('../sw.js').catch(function(){});
})();
</script>
